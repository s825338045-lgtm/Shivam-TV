<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bharat TV Pro - Modified VLC Engine Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0b0f19; color: #f1f5f9; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .active-cat { background: linear-gradient(135deg, #f97316, #ea580c) !important; color: white !important; font-weight: 700; box-shadow: 0 4px 15px rgba(249, 115, 22, 0.35); }
    .vlc-glow { box-shadow: 0 0 25px -5px rgba(249, 115, 22, 0.25); }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <!-- TOP APP BAR -->
  <header class="w-full bg-slate-900/95 border-b border-slate-800 sticky top-0 z-50 backdrop-blur">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-amber-600 via-orange-500 to-amber-400 flex items-center justify-center font-bold text-white shadow-lg shadow-orange-500/30 text-sm">
          ⚡
        </div>
        <h1 class="text-base font-bold tracking-tight">Bharat<span class="text-orange-500">TV</span> <span class="text-[10px] uppercase px-1.5 py-0.5 rounded bg-orange-500/20 text-orange-400 font-extrabold border border-orange-500/30 ml-1">Pro Engine</span></h1>
      </div>
      
      <!-- Right Quick Action: Add Stream Modal Toggle -->
      <button onclick="toggleCustomModal()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs text-orange-400 border border-slate-700 font-semibold flex items-center gap-1.5 transition">
        <span>➕ Add Link</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-4xl mx-auto w-full px-3 py-3 flex-1 flex flex-col gap-3">
    
    <!-- STICKY 16:9 VIDEO PLAYER WITH VLC BUFFER EMULATION -->
    <div class="w-full bg-black rounded-2xl overflow-hidden border border-slate-800 vlc-glow relative sticky top-14 z-40 aspect-video">
      <video id="tvVideo" class="w-full h-full object-contain" playsinline webkit-playsinline controls autoplay></video>
      <iframe id="ytIframe" class="w-full h-full absolute inset-0 hidden border-0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
      
      <!-- Native LibVLC Buffer Spinner Overlay -->
      <div id="loader" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center gap-2 hidden pointer-events-none">
        <div class="w-10 h-10 border-4 border-slate-700 border-t-orange-500 rounded-full animate-spin"></div>
        <span id="loaderText" class="text-xs text-white font-medium">LibVLC Buffering (30s Window)...</span>
      </div>
    </div>

    <!-- PLAYING INFO & BUFFER TELEMETRY BAR -->
    <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex items-center justify-between gap-2">
      <div class="min-w-0 flex-1">
        <h2 id="nowPlayingTitle" class="text-xs sm:text-sm font-bold truncate text-white">Select a channel below</h2>
        <p id="nowPlayingMeta" class="text-[10px] sm:text-xs text-slate-400 truncate">VLC Multi-threaded Adaptive Bitrate Engine</p>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <span class="text-[10px] font-mono bg-black/60 text-slate-300 px-2 py-1 rounded border border-slate-700">
          Buf: <span id="telemetrySec" class="text-orange-400 font-bold">0.0s</span>
        </span>
        <span id="nowPlayingBadge" class="text-[10px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold uppercase">Ready</span>
      </div>
    </div>

    <!-- 5 CATEGORY FILTER CHIPS -->
    <div class="flex items-center space-x-2 overflow-x-auto hide-scrollbar py-1">
      <button onclick="setCategory('ALL')" id="cat-ALL" class="active-cat px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 shrink-0">⚡ All</button>
      <button onclick="setCategory('Movies')" id="cat-Movies" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 shrink-0">🎬 Movies</button>
      <button onclick="setCategory('Cartoons')" id="cat-Cartoons" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 shrink-0">👶 Cartoons & Anime</button>
      <button onclick="setCategory('Serials')" id="cat-Serials" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 shrink-0">📺 Serials & Shows</button>
      <button onclick="setCategory('Music')" id="cat-Music" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 shrink-0">🎵 Music</button>
      <button onclick="setCategory('News')" id="cat-News" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 shrink-0">📰 Top News</button>
    </div>

    <!-- SEARCH BAR -->
    <input 
      id="searchBox" 
      type="text" 
      placeholder="🔍 Instant channel search..." 
      oninput="renderChannels()"
      class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-500 outline-none focus:border-orange-500"
    />

    <!-- CLEAN OTT CHANNELS GRID -->
    <div id="channelGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 pb-12">
      <!-- Dynamic list injected here -->
    </div>

  </main>

  <!-- HIDDEN CUSTOM LINK INJECTOR MODAL (VLC M3U8 STORE) -->
  <div id="customModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-4 space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-white flex items-center gap-1.5">
          <span>🔗</span> Add Custom / Paid Stream Link
        </h3>
        <button onclick="toggleCustomModal()" class="text-slate-400 hover:text-white text-base">✕</button>
      </div>
      <p class="text-[11px] text-slate-400">
        VLC की तरह कोई भी M3U8 लिंक डालें। यह आपके फोन में परमानेंट सेव रहेगा।
      </p>

      <input id="customName" type="text" placeholder="Channel Name (e.g. My Colors HD)" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-orange-500" />
      
      <select id="customCategory" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-300 outline-none focus:border-orange-500">
        <option value="Movies">🎬 Movies</option>
        <option value="Cartoons">👶 Cartoons & Anime</option>
        <option value="Serials">📺 Serials & Shows</option>
        <option value="Music">🎵 Music</option>
        <option value="News">📰 Top News</option>
      </select>

      <input id="customUrl" type="text" placeholder="Paste Direct .m3u8 Stream Link" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-orange-500" />

      <div class="flex gap-2 pt-1">
        <button onclick="saveCustomChannel()" class="flex-1 py-2 bg-orange-600 hover:bg-orange-500 text-white rounded-xl text-xs font-bold transition">Save Channel</button>
        <button onclick="toggleCustomModal()" class="px-3 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // --- 1. DEFAULT VERIFIED STREAMS ---
    const DEFAULT_CHANNELS = [
      // MOVIES
      { id: "mov-1", name: "B4U Movies HD", category: "Movies", type: "live", url: "https://d35j504z0x2vu2.cloudfront.net/v1/master/0bc8e8383314d027cc14002e1ec0f720f7b62fd7/B4U-Movies-IN/master.m3u8", logo: "🍿" },
      { id: "mov-2", name: "Goldmines Movies", category: "Movies", type: "yt", ytId: "9o4f0gC32-I", logo: "🎥" },
      
      // CARTOONS & ANIME
      { id: "car-1", name: "Animax Asia", category: "Cartoons", type: "live", url: "https://d279m93yvdal2t.cloudfront.net/out/v1/Animax_India/index.m3u8", logo: "🦸" },
      { id: "car-2", name: "Shaktimaan Hindi Hero", category: "Cartoons", type: "yt", ytId: "X8rN9m2kPq0", logo: "⚡" },

      // SERIALS & SHOWS
      { id: "ser-1", name: "DD National Classics", category: "Serials", type: "live", url: "https://amg01448-dd-national-samsungin-6jsh4.amagi.tv/playlist.m3u8", logo: "🇮🇳" },
      { id: "ser-2", name: "Ramayan (1987) Ep 1", category: "Serials", type: "yt", ytId: "9o4f0gC32-I", logo: "🏹" },
      { id: "ser-3", name: "Mahabharat (1988) Ep 1", category: "Serials", type: "yt", ytId: "P_hFqQ3qB20", logo: "👑" },
      { id: "ser-4", name: "Malgudi Days Ep 1", category: "Serials", type: "yt", ytId: "P_Q7rNq9Gg8", logo: "🏡" },

      // MUSIC
      { id: "mus-1", name: "9XM Bollywood", category: "Music", type: "live", url: "https://d35j504z0x2vu2.cloudfront.net/v1/master/0bc8e8383314d027cc14002e1ec0f720f7b62fd7/9XM/master.m3u8", logo: "🎸" },
      { id: "mus-2", name: "9X Jalwa Retro", category: "Music", type: "live", url: "https://d35j504z0x2vu2.cloudfront.net/v1/master/0bc8e8383314d027cc14002e1ec0f720f7b62fd7/9X-Jalwa/master.m3u8", logo: "💃" },
      { id: "mus-3", name: "AIR Vividh Bharati", category: "Music", type: "live", url: "https://air.pc.cdn.bitgravity.com/air/live/pcr:Vividh_Bharati/playlist.m3u8", logo: "📻" },

      // TOP NEWS
      { id: "new-1", name: "Aaj Tak HD", category: "News", type: "live", url: "https://feeds.intoday.in/aajtak/api/livetv-video/index.m3u8", logo: "🔴" },
      { id: "new-2", name: "ABP News", category: "News", type: "live", url: "https://abp-i.akamaihd.net/hls/live/765529/abpnews/master.m3u8", logo: "📰" },
      { id: "new-3", name: "India TV", category: "News", type: "live", url: "https://indiatvnews.live-s.cdn.bitgravity.com/live/indiatvnews.smil/playlist.m3u8", logo: "🇮🇳" },
      { id: "new-4", name: "DD News HD", category: "News", type: "live", url: "https://amg01448-dd-news-samsungin-22h7c.amagi.tv/playlist.m3u8", logo: "📡" }
    ];

    // Load custom saved links from phone memory
    let customChannels = JSON.parse(localStorage.getItem('bharat_custom_streams') || '[]');
    let allChannels = [...customChannels, ...DEFAULT_CHANNELS];
    let currentCategory = 'ALL';
    let hls = null;

    const video = document.getElementById('tvVideo');
    const iframe = document.getElementById('ytIframe');
    const loader = document.getElementById('loader');

    // --- 2. VLC BUFFER TELEMETRY TIMER ---
    setInterval(() => {
      const telBadge = document.getElementById('telemetrySec');
      if (!video || video.paused || !video.buffered || video.buffered.length === 0) {
        telBadge.textContent = '0.0s';
        return;
      }
      const cur = video.currentTime;
      let buf = 0;
      for (let i = 0; i < video.buffered.length; i++) {
        if (video.buffered.start(i) <= cur && cur <= video.buffered.end(i)) {
          buf = video.buffered.end(i) - cur;
          break;
        }
      }
      telBadge.textContent = buf.toFixed(1) + 's';
    }, 1000);

    // --- 3. PLAY ENGINE (LibVLC Emulation) ---
    function playItem(item) {
      document.getElementById('nowPlayingTitle').textContent = item.name;
      document.getElementById('nowPlayingMeta').textContent = `${item.category} • Modified VLC Engine Playback`;
      document.getElementById('nowPlayingBadge').textContent = item.type === 'live' ? 'LIVE' : 'EPISODES';

      if (item.type === 'live') {
        iframe.classList.add('hidden');
        iframe.src = '';
        video.classList.remove('hidden');
        loader.classList.remove('hidden');

        if (Hls.isSupported()) {
          if (hls) hls.destroy();
          // LibVLC Buffering parameters (30s window, workers enabled)
          hls = new Hls({
            maxBufferLength: 30,
            maxMaxBufferLength: 60,
            maxBufferSize: 30 * 1000 * 1000,
            enableWorker: true,
            lowLatencyMode: false,
            backBufferLength: 15
          });
          hls.loadSource(item.url);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            loader.classList.add('hidden');
            video.play().catch(() => {});
          });
          hls.on(Hls.Events.ERROR, () => {
            loader.classList.add('hidden');
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = item.url;
          video.play().catch(() => {});
          loader.classList.add('hidden');
        }
      } else {
        if (hls) hls.destroy();
        video.pause();
        video.classList.add('hidden');
        loader.classList.add('hidden');
        iframe.src = `https://www.youtube-nocookie.com/embed/${item.ytId}?autoplay=1`;
        iframe.classList.remove('hidden');
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // --- 4. CATEGORY & SEARCH FILTER ---
    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('[id^="cat-"]').forEach(btn => btn.classList.remove('active-cat'));
      document.getElementById('cat-' + cat).classList.add('active-cat');
      renderChannels();
    }

    function renderChannels() {
      const grid = document.getElementById('channelGrid');
      const search = document.getElementById('searchBox').value.toLowerCase();
      
      const filtered = allChannels.filter(c => {
        const matchesCat = (currentCategory === 'ALL' || c.category === currentCategory);
        const matchesSearch = c.name.toLowerCase().includes(search) || c.category.toLowerCase().includes(search);
        return matchesCat && matchesSearch;
      });

      grid.innerHTML = filtered.map(ch => `
        <div onclick='playItem(${JSON.stringify(ch)})' class="bg-slate-900 border border-slate-800 hover:border-orange-500/80 p-2.5 sm:p-3 rounded-xl flex items-center space-x-2.5 cursor-pointer active:scale-95 transition">
          <span class="text-2xl p-1 bg-slate-950 rounded-lg border border-slate-800 shrink-0">${ch.logo || '📺'}</span>
          <div class="min-w-0 flex-1">
            <h3 class="text-xs font-bold text-white truncate">${ch.name}</h3>
            <span class="text-[10px] text-orange-400 font-medium">${ch.category}</span>
          </div>
        </div>
      `).join('');
    }

    // --- 5. CUSTOM LINK INJECTOR (VLC MEMORY) ---
    function toggleCustomModal() {
      const modal = document.getElementById('customModal');
      modal.classList.toggle('hidden');
    }

    function saveCustomChannel() {
      const name = document.getElementById('customName').value.trim();
      const cat = document.getElementById('customCategory').value;
      const url = document.getElementById('customUrl').value.trim();

      if (!name || !url) {
        alert('Please enter both channel name and stream URL');
        return;
      }

      const newChan = {
        id: 'cust-' + Date.now(),
        name: name,
        category: cat,
        type: 'live',
        url: url,
        logo: '⭐'
      };

      customChannels.unshift(newChan);
      localStorage.setItem('bharat_custom_streams', JSON.stringify(customChannels));
      allChannels = [...customChannels, ...DEFAULT_CHANNELS];

      toggleCustomModal();
      document.getElementById('customName').value = '';
      document.getElementById('customUrl').value = '';

      renderChannels();
      playItem(newChan);
    }

    // Start App
    renderChannels();
    playItem(allChannels[0]);
  </script>
</body>
</html>
