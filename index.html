<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MangaVerse - Anti-Block Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="min-h-screen flex flex-col p-4">

  <!-- Header -->
  <header class="w-full max-w-3xl mx-auto mb-6 text-center">
    <h1 class="text-3xl font-bold text-orange-500 mb-2">Manga<span class="text-white">Verse</span> ⚡</h1>
    <p class="text-xs text-slate-400 mb-4">Secured Proxy Connection (No VPN Needed)</p>
    
    <div class="flex gap-2">
      <input id="searchInput" type="text" placeholder="Search Manga (e.g., Solo Leveling)..." 
             class="flex-1 p-3 rounded-xl bg-slate-800 border border-slate-700 text-sm outline-none focus:border-orange-500 text-white"
             onkeydown="if(event.key === 'Enter') fetchManga()">
      <button onclick="fetchManga()" class="bg-orange-600 hover:bg-orange-500 px-5 py-3 rounded-xl font-bold text-sm transition">
        Search
      </button>
    </div>
  </header>

  <!-- Loader & Error Display -->
  <div id="loader" class="text-center text-orange-400 font-bold text-sm hidden">
    Bypassing Blocks & Fetching... ⏳
  </div>
  <div id="errorMsg" class="text-center text-red-400 font-bold text-sm hidden"></div>

  <!-- Results Grid -->
  <main id="mangaGrid" class="w-full max-w-3xl mx-auto grid grid-cols-2 md:grid-cols-3 gap-4 pb-10">
  </main>

  <script>
    async function fetchManga() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const grid = document.getElementById('mangaGrid');
      const loader = document.getElementById('loader');
      const errorMsg = document.getElementById('errorMsg');
      
      grid.innerHTML = '';
      errorMsg.classList.add('hidden');
      loader.classList.remove('hidden');

      try {
        // 1. Direct Target URL
        const targetUrl = `https://api.mangadex.org/manga?title=${encodeURIComponent(query)}&limit=12&includes[]=cover_art`;
        
        // 2. Routing through AllOrigins Proxy to bypass ISP Block
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
        
        const res = await fetch(proxyUrl);
        if (!res.ok) throw new Error("Proxy connection failed.");
        
        const data = await res.json();
        loader.classList.add('hidden');

        if (!data.data || data.data.length === 0) {
          grid.innerHTML = '<p class="text-slate-400 col-span-full text-center">No manga found!</p>';
          return;
        }

        data.data.forEach(manga => {
          const title = manga.attributes.title.en || manga.attributes.title['ja-ro'] || 'Unknown Title';
          
          const coverRel = manga.relationships.find(rel => rel.type === 'cover_art');
          const coverFileName = coverRel ? coverRel.attributes.fileName : '';
          
          // 3. Image Proxy: Bypassing Image blocks using wsrv.nl
          let coverUrl = 'https://via.placeholder.com/256x350?text=No+Cover';
          if (coverFileName) {
            const rawImg = `https://uploads.mangadex.org/covers/${manga.id}/${coverFileName}.256.jpg`;
            coverUrl = `https://wsrv.nl/?url=${rawImg}`; 
          }

          const card = document.createElement('div');
          card.className = 'glass-card border border-slate-700 rounded-xl overflow-hidden hover:border-orange-500 transition cursor-pointer flex flex-col';
          card.innerHTML = `
            <img src="${coverUrl}" alt="Cover" class="w-full h-48 sm:h-64 object-cover" loading="lazy">
            <div class="p-3 flex-1 flex flex-col justify-between">
              <h3 class="text-xs sm:text-sm font-bold text-white line-clamp-2 mb-1">${title}</h3>
              <span class="text-[10px] text-orange-400 font-bold bg-orange-500/10 px-2 py-1 rounded inline-block w-max mt-2">
                READ NOW ➔
              </span>
            </div>
          `;
          grid.appendChild(card);
        });

      } catch (error) {
        loader.classList.add('hidden');
        errorMsg.classList.remove('hidden');
        errorMsg.innerText = `Error: ${error.message} (Try again)`;
      }
    }

    // Auto-load on start
    document.getElementById('searchInput').value = 'Jujutsu';
    fetchManga();
  </script>
</body>
</html>
