<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JARVIS - Personal AI Copilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #050811; color: #e2e8f0; }
    .glow-cyan { box-shadow: 0 0 25px -5px rgba(6, 182, 212, 0.3); }
    .pulse-ring { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .7; transform: scale(1.05); } }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <!-- TOP BAR -->
  <header class="w-full bg-slate-950/80 border-b border-cyan-900/40 p-3.5 sticky top-0 z-50 backdrop-blur">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-7 h-7 rounded-lg bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center text-cyan-400 font-bold text-xs pulse-ring">
          ◈
        </div>
        <h1 class="text-sm font-bold tracking-wider uppercase text-white">
          JARVIS <span class="text-[10px] text-cyan-400 font-mono">v1.0</span>
        </h1>
      </div>
      <button onclick="toggleKeyModal()" class="px-2.5 py-1 rounded-lg bg-slate-900 border border-slate-800 text-[11px] text-slate-300 font-mono hover:text-cyan-400 transition">
        ⚙️ <span id="keyStatus">Set API Key</span>
      </button>
    </div>
  </header>

  <!-- CHAT WINDOW -->
  <main id="chatWindow" class="flex-1 max-w-xl mx-auto w-full p-4 overflow-y-auto space-y-4 pb-28">
    <div class="p-4 rounded-2xl bg-gradient-to-br from-slate-900 via-slate-900 to-cyan-950/30 border border-cyan-900/30 glow-cyan">
      <div class="flex items-center space-x-2 mb-2">
        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
        <span class="text-xs font-bold text-cyan-400 font-mono uppercase tracking-wider">System Online</span>
      </div>
      <h2 class="text-sm font-bold text-white mb-1">Namaste! Main aapka personal AI Assistant hoon.</h2>
      <p class="text-xs text-slate-400 leading-relaxed">
        Mujhse kuch bhi puchiye — YouTube ideas, Coding, translation ya planning.
      </p>
    </div>
  </main>

  <!-- BOTTOM INPUT BAR -->
  <div class="fixed bottom-0 inset-x-0 bg-slate-950/90 border-t border-slate-900 p-3 backdrop-blur z-40">
    <div class="max-w-xl mx-auto flex items-center gap-2">
      <button id="micBtn" onclick="toggleSpeech()" class="p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-cyan-400 hover:border-cyan-500/50 transition shrink-0">
        🎙️
      </button>
      <input 
        id="userInput" 
        type="text" 
        placeholder="Type a command or ask anything..." 
        onkeydown="if(event.key === 'Enter') sendQuery()"
        class="flex-1 px-3.5 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-500 outline-none focus:border-cyan-500 transition"
      />
      <button onclick="sendQuery()" class="px-4 py-2.5 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white rounded-xl text-xs font-bold transition shadow-lg shadow-cyan-500/20 shrink-0">
        Send
      </button>
    </div>
  </div>

  <!-- API KEY MODAL -->
  <div id="keyModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-4 space-y-3">
      <h3 class="text-sm font-bold text-white flex items-center gap-1.5">
        <span>🔑</span> Google Gemini API Key
      </h3>
      <p class="text-xs text-slate-400">
        Apni Gemini API Key yahan paste karein (ye aapke browser me safe rahegi):
      </p>
      <input id="apiInput" type="text" placeholder="AIzaSy..." class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-cyan-500 font-mono" />
      <div class="flex gap-2 pt-1">
        <button onclick="saveApiKey()" class="flex-1 py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl text-xs font-bold transition">Save Key</button>
        <button onclick="toggleKeyModal()" class="px-3 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    let apiKey = localStorage.getItem('jarvis_gemini_key') || '';
    let recognition = null;
    let isListening = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new Speech();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'hi-IN';

      recognition.onresult = (event) => {
        document.getElementById('userInput').value = event.results[0][0].transcript;
        sendQuery();
      };
      recognition.onend = () => {
        isListening = false;
        document.getElementById('micBtn').classList.remove('bg-red-500/20', 'border-red-500');
      };
    }

    function toggleSpeech() {
      if (!recognition) {
        alert('Voice recognition not supported in this browser.');
        return;
      }
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
        isListening = true;
        document.getElementById('micBtn').classList.add('bg-red-500/20', 'border-red-500');
      }
    }

    function toggleKeyModal() {
      document.getElementById('keyModal').classList.toggle('hidden');
    }

    function saveApiKey() {
      const val = document.getElementById('apiInput').value.trim();
      if (!val) return;
      apiKey = val;
      localStorage.setItem('jarvis_gemini_key', val);
      document.getElementById('keyStatus').textContent = 'Key Active ✅';
      toggleKeyModal();
    }

    if (apiKey) {
      document.getElementById('keyStatus').textContent = 'Key Active ✅';
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const clean = text.replace(/[*#_`]/g, '');
        const utter = new SpeechSynthesisUtterance(clean);
        utter.lang = 'hi-IN';
        window.speechSynthesis.speak(utter);
      }
    }

    function appendMessage(sender, text) {
      const win = document.getElementById('chatWindow');
      const isUser = sender === 'user';
      
      const box = document.createElement('div');
      box.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
      box.innerHTML = `
        <div class="max-w-[85%] p-3 rounded-2xl text-xs leading-relaxed ${
          isUser 
            ? 'bg-cyan-600 text-white rounded-tr-none' 
            : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-tl-none shadow-md'
        }">
          <p class="font-bold text-[10px] mb-1 opacity-70 font-mono">${isUser ? 'YOU' : 'JARVIS'}</p>
          <div class="whitespace-pre-wrap">${text}</div>
        </div>
      `;
      win.appendChild(box);
      win.scrollTo({ top: win.scrollHeight, behavior: 'smooth' });
    }

    async function sendQuery() {
      const input = document.getElementById('userInput');
      const query = input.value.trim();
      if (!query) return;

      if (!apiKey) {
        toggleKeyModal();
        return;
      }

      appendMessage('user', query);
      input.value = '';

      const win = document.getElementById('chatWindow');
      const loadingBox = document.createElement('div');
      loadingBox.id = 'tempLoader';
      loadingBox.className = 'flex justify-start';
      loadingBox.innerHTML = `
        <div class="p-3 bg-slate-900 border border-slate-800 rounded-2xl rounded-tl-none text-xs text-cyan-400 font-mono flex items-center gap-2">
          <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-bounce"></span>
          <span>Thinking...</span>
        </div>
      `;
      win.appendChild(loadingBox);
      win.scrollTo({ top: win.scrollHeight, behavior: 'smooth' });

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey.trim()}`;
        const promptText = `You are JARVIS, an intelligent and concise AI assistant. Answer directly and smartly in Hindi/Hinglish.\n\nUser Question: ${query}`;

        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: promptText }]
            }]
          })
        });

        const data = await res.json();
        document.getElementById('tempLoader')?.remove();

        if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
          const aiResponse = data.candidates[0].content.parts[0].text;
          appendMessage('ai', aiResponse);
          speak(aiResponse);
        } else if (data.error) {
          appendMessage('ai', 'Google API Error: ' + data.error.message);
        } else {
          appendMessage('ai', 'Received empty response from API.');
        }
      } catch (err) {
        document.getElementById('tempLoader')?.remove();
        appendMessage('ai', 'Network error: ' + err.message);
      }
    }
  </script>
</body>
</html>
